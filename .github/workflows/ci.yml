name: CI

# Build check for both shipping artifacts (Windows .exe + Android .apk) without
# publishing anything.  It exists to catch the two failure modes that keep
# biting this repo:
#
#   1. dependency drift: the toolchain is pinned to Rust 1.75 (Windows 7
#      support) and cargo 1.75 cannot even parse the manifest of a crate
#      published with edition 2024 -> "feature `edition2024` is required".
#      The fix is a committed Cargo.lock, resolved with the MSRV-aware
#      resolver; this workflow verifies that lock on every run.
#   2. anything that breaks the actual release builds.
#
# `workflow_dispatch` with "refresh lockfile" checked re-resolves the whole
# graph with an MSRV-aware resolver, builds with the result and uploads it, so
# you can test a dependency refresh before committing the new Cargo.lock.

on:
  workflow_dispatch:
    inputs:
      refresh_lockfile:
        description: "Re-resolve with the MSRV-aware resolver and build with that lockfile"
        required: false
        type: boolean
        default: false
  pull_request:
  push:
    branches: [main, "arena/**"]

permissions:
  contents: read

env:
  # Must match the channel in rust-toolchain.toml; kept here so the build
  # steps can print/install it explicitly.
  RUST_ACADEMY_MSRV: 1.75.0

jobs:
  lockfile:
    name: Cargo.lock is MSRV-safe
    runs-on: ubuntu-latest
    outputs:
      # true when the lockfile in the repository was (re)generated by this run
      generated: ${{ steps.resolve.outputs.generated }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Refresh the lockfile when requested (or when none is committed)
        id: resolve
        run: |
          if [ "${{ inputs.refresh_lockfile }}" = "true" ] || [ ! -f Cargo.lock ]; then
            RESOLVE_TOOLCHAIN=stable ./scripts/refresh-lockfile.sh --full
            echo "generated=true" >> "$GITHUB_OUTPUT"
          else
            echo "generated=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Verify the lockfile is readable and complete for the pinned cargo
        run: |
          # `cargo` here is the pinned 1.75.0 toolchain (rust-toolchain.toml);
          # `fetch --locked` downloads + unpacks every locked crate and fails
          # on the first manifest this cargo cannot parse.
          cargo fetch --locked
          python3 scripts/check-msrv-lock.py

      - name: Report drift against what the MSRV resolver would pick today
        if: ${{ inputs.refresh_lockfile != true }}
        run: |
          cp Cargo.lock /tmp/committed-Cargo.lock
          if ! RESOLVE_TOOLCHAIN=stable ./scripts/refresh-lockfile.sh --full; then
            echo "::warning::the MSRV-aware resolver cannot currently reproduce a lockfile; keep the committed one"
          fi
          if diff -q /tmp/committed-Cargo.lock Cargo.lock >/dev/null 2>&1; then
            echo "Cargo.lock matches a fresh MSRV-aware resolution."
          else
            echo "::warning::Cargo.lock differs from a fresh MSRV-aware resolution (new dependency versions were published). Run ./scripts/refresh-lockfile.sh and commit the result when convenient."
            diff -u /tmp/committed-Cargo.lock Cargo.lock | head -80 || true
          fi
          cp /tmp/committed-Cargo.lock Cargo.lock

      - name: Upload the lockfile
        if: ${{ steps.resolve.outputs.generated == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: cargo-lock
          path: Cargo.lock
          if-no-files-found: error

  windows:
    name: Windows executable (Windows 7 - 11)
    runs-on: windows-latest
    needs: lockfile
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Use the freshly generated lockfile
        if: ${{ needs.lockfile.outputs.generated == 'true' }}
        uses: actions/download-artifact@v4
        with:
          name: cargo-lock
          path: .

      - name: Build release executable
        env:
          RUST_ACADEMY_VERSION: 0.0.0-ci
        run: |
          cargo build --release --bin rust-academy --locked

  android:
    name: Android APK (Android 7.0 - latest)
    runs-on: ubuntu-latest
    needs: lockfile
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android SDK command line tools
        uses: android-actions/setup-android@v3

      - name: Install Android platform, build-tools and NDK
        run: |
          yes | sdkmanager --licenses >/dev/null
          sdkmanager "platforms;android-35" \
                     "build-tools;35.0.0" \
                     "ndk;26.1.10909125"

      - name: Install cargo-apk with a stable toolchain
        run: |
          rustup toolchain install stable --profile minimal
          rustup run stable cargo install cargo-apk --locked --version 0.9.7 --root /tmp/cargo-apk
          echo "/tmp/cargo-apk/bin" >> "$GITHUB_PATH"

      - name: Use the freshly generated lockfile
        if: ${{ needs.lockfile.outputs.generated == 'true' }}
        uses: actions/download-artifact@v4
        with:
          name: cargo-lock
          path: .

      - name: Vendor + patch Slint's Android backend for API 24
        run: bash scripts/prepare-vendor.sh

      - name: Check that Cargo.lock is in sync
        # cargo-apk does not forward flags like --locked to the inner cargo
        # invocation, so verify the lockfile separately: if it were out of sync,
        # the inner cargo would silently re-resolve and could pull in a crate
        # that cargo 1.75 cannot parse.
        run: cargo metadata --locked --format-version 1 > /dev/null

      - name: Build release APK
        run: |
          export ANDROID_NDK_ROOT="${ANDROID_HOME}/ndk/26.1.10909125"
          export RUST_ACADEMY_VERSION=0.0.0-ci
          cargo apk build --release --lib
