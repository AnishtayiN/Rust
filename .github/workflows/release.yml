name: Release

# Manual-only release pipeline. The version typed into the `workflow_dispatch`
# dialog is used for:
#   * the `[package] version` in Cargo.toml (+ Cargo.lock) -> APK
#     versionName/versionCode + EXE resources
#   * the artifact names
#   * the Git tag / GitHub release (v<version>)
#
# The release contains exactly two artifacts:
#   * rust-academy-<version>-android.apk  (Android 7.0 / API 24 -> latest)
#   * rust-academy-<version>-windows.exe  (Windows 7 -> Windows 11)
#
# Both jobs build with `--locked`: the toolchain is pinned to Rust 1.75 (the
# last one that produces Windows 7 binaries) and cargo 1.75 cannot parse the
# manifest of any crate published with edition 2024, so the dependency graph
# must come from the committed, MSRV-resolved Cargo.lock instead of a fresh
# resolution.  Run `./scripts/refresh-lockfile.sh` (or the `CI` workflow with
# "refresh lockfile" enabled) when dependencies have to move.
on:
  workflow_dispatch:
    inputs:
      version:
        description: "App version to release (semver, e.g. 1.0.0)"
        required: true
        type: string

permissions:
  contents: write

jobs:
  windows:
    name: Windows executable (Windows 7 - 11)
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      # rust-toolchain.toml pins Rust 1.75.0 (the last toolchain that can
      # produce Windows 7 compatible binaries) and the needed targets; the
      # first `cargo` invocation installs them automatically.

      - name: Apply the requested version
        shell: bash
        run: python scripts/set-version.py "${{ inputs.version }}"

      - name: Build release executable
        shell: bash
        env:
          RUST_ACADEMY_VERSION: ${{ inputs.version }}
        run: |
          cargo build --release --bin rust-academy --locked

      - name: Rename artifact
        shell: bash
        run: |
          mkdir -p dist
          cp target/release/rust-academy.exe "dist/rust-academy-${{ inputs.version }}-windows.exe"

      - name: Upload Windows executable
        uses: actions/upload-artifact@v4
        with:
          name: windows-exe
          path: dist/rust-academy-${{ inputs.version }}-windows.exe
          if-no-files-found: error

  android:
    name: Android APK (Android 7.0 - latest)
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android SDK command line tools
        uses: android-actions/setup-android@v3

      - name: Install Android platform, build-tools and NDK
        run: |
          yes | sdkmanager --licenses >/dev/null
          sdkmanager "platforms;android-35" \
                     "build-tools;35.0.0" \
                     "ndk;26.1.10909125"

      # rust-toolchain.toml pins Rust 1.75.0 + the Android targets; the first
      # `cargo` invocation installs them automatically.

      - name: Install cargo-apk with a stable toolchain
        run: |
          rustup toolchain install stable --profile minimal
          rustup run stable cargo install cargo-apk --locked --version 0.9.7 --root /tmp/cargo-apk
          echo "/tmp/cargo-apk/bin" >> "$GITHUB_PATH"

      - name: Apply the requested version
        run: python3 scripts/set-version.py "${{ inputs.version }}"

      - name: Vendor + patch Slint's Android backend for API 24
        run: bash scripts/prepare-vendor.sh

      - name: Check that Cargo.lock is in sync
        # `cargo apk` does not forward flags such as --locked to the inner
        # cargo call, so assert the lockfile is both readable by cargo 1.75 and
        # in sync with Cargo.toml before handing control to cargo-apk.
        run: cargo metadata --locked --format-version 1 > /dev/null

      - name: Build release APK
        env:
          RUST_ACADEMY_VERSION: ${{ inputs.version }}
        run: |
          export ANDROID_NDK_ROOT="${ANDROID_HOME}/ndk/26.1.10909125"
          cargo apk build --release --lib

      - name: Rename artifact
        run: |
          mkdir -p dist
          cp target/release/apk/rust-academy.apk "dist/rust-academy-${{ inputs.version }}-android.apk"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: dist/rust-academy-${{ inputs.version }}-android.apk
          if-no-files-found: error

  release:
    name: Publish GitHub release
    needs: [windows, android]
    runs-on: ubuntu-latest
    steps:
      - name: Download both artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Verify exactly two artifacts exist
        run: |
          ls -la release-assets
          count=$(find release-assets -maxdepth 1 -type f | wc -l)
          test "$count" -eq 2 || { echo "Expected exactly 2 artifacts, found $count"; exit 1; }
          test -f "release-assets/rust-academy-${{ inputs.version }}-android.apk"
          test -f "release-assets/rust-academy-${{ inputs.version }}-windows.exe"

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v${{ inputs.version }}" \
            "release-assets/rust-academy-${{ inputs.version }}-android.apk" \
            "release-assets/rust-academy-${{ inputs.version }}-windows.exe" \
            --title "Rust Academy ${{ inputs.version }}" \
            --notes "Rust Academy ${{ inputs.version }}

          **Android**: install the APK (Android 7.0 and newer).
          **Windows**: run the executable (Windows 7 and newer).

          Built from commit ${{ github.sha }} on branch \`${{ github.ref_name }}\`."
