name: Lockfile probe

# TEMPORARY diagnostic workflow: find out which cargo can produce a Cargo.lock
# that cargo 1.75 accepts (lockfile format, MSRV-aware resolution) without
# having to read the raw Actions log.  Results are published as check-run
# annotations, which are readable through the REST API.

on:
  workflow_dispatch:
  push:
    branches: ["arena/**"]

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Probe
        run: |
          set +e
          rustup toolchain install 1.75.0 --profile minimal >/dev/null
          for tc in stable 1.84.0; do
            out="/tmp/info-$tc.txt"
            echo "===== toolchain $tc =====" > "$out"
            rustup toolchain install "$tc" --profile minimal >/dev/null 2>&1
            rustup run "$tc" cargo --version >> "$out" 2>&1
            rm -f Cargo.lock
            timeout 600 rustup run "$tc" cargo generate-lockfile \
              --config 'resolver.incompatible-rust-versions="fallback"' >> "$out" 2>&1
            echo "generate rc=$?" >> "$out"
            echo "--- lock head ---" >> "$out"
            head -4 Cargo.lock >> "$out" 2>&1
            echo "--- packages: $(grep -c '^\[\[package\]\]' Cargo.lock 2>/dev/null) ---" >> "$out"
            if [ -f Cargo.lock ]; then
              timeout 900 cargo +1.75.0 fetch --locked >> "$out" 2>&1
              echo "fetch rc=$?" >> "$out"
              timeout 300 cargo +1.75.0 metadata --locked --format-version 1 > /dev/null 2>> "$out"
              echo "metadata rc=$?" >> "$out"
              python3 scripts/check-msrv-lock.py --allow-unfetched >> "$out" 2>&1
              echo "check rc=$?" >> "$out"
            fi
          done
          echo "===== done =====" >> /tmp/info-summary.txt
          cat /tmp/info-*.txt > /tmp/all.txt
          python3 - <<'PYEOF'
          import pathlib, math
          text = pathlib.Path("/tmp/all.txt").read_text(errors="replace")
          text = text.replace("\r", "").replace("%", "%25").replace("\n", "%0A")
          size = 1600
          parts = math.ceil(len(text) / size)
          for index in range(parts):
              print(f"::error::part {index + 1}/{parts}::{text[index * size:(index + 1) * size]}")
          PYEOF
          echo "probe finished"

      - name: Fail
        run: exit 1
